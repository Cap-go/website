sonar.projectKey=Cap-go_website
sonar.organization=cap-go
sonar.sources=.

# pr-preview-web.yml intentionally pins GitHub Actions by version tag (repo policy).
sonar.issue.ignore.multicriteria=previewWorkflowActionTags
sonar.issue.ignore.multicriteria.previewWorkflowActionTags.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.previewWorkflowActionTags.resourceKey=.github/workflows/pr-preview-web.yml

# Static docs/blog content is intentionally generated and verbose.
# Keep it out of code-quality and duplication gates for this repo split.
sonar.exclusions=\
  .github/workflows/pr-preview-web.yml,\
  apps/docs/src/content/**,\
  apps/web/src/content/**,\
  docs/**,\
  loadedVectorStore/**,\
  node_modules/**,\
  apps/**/dist/**,\
  apps/**/.astro/**,\
  **/tailwind-capacitor-snapshot/**,\
  README.md

# Agent, competitor, and refusal-story data: one same-shaped entry per item, so CPD flags the shape, not copied logic.
sonar.cpd.exclusions=\
  apps/web/src/data/app-store-refusal-stories/stories/**,\
  apps/web/src/lib/securityQuestionnaireEnterprise.ts,\
  apps/web/src/data/agents.ts,\
  apps/web/src/data/alternatives/**,\
  scripts/lib/social-images.ts,\
  apps/web/src/pages/security-questionnaire.astro,\
  apps/docs/astro.config.mjs,\
  apps/web/astro.config.mjs,\
  apps/docs/src/content/**,\
  apps/web/src/content/**,\
  **/tailwind-capacitor-snapshot/**,\
  apps/web/src/components/tailwind-capacitor-demo/state-manifest.json,\
  docs/**,\
  README.md