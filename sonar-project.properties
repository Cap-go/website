sonar.projectKey=Cap-go_website
sonar.organization=cap-go
sonar.sources=.

# Static docs/blog content is intentionally generated and verbose.
# Keep it out of code-quality and duplication gates for this repo split.
sonar.exclusions=\
  apps/docs/src/content/**,\
  apps/web/src/content/**,\
  docs/**,\
  loadedVectorStore/**,\
  node_modules/**,\
  apps/**/dist/**,\
  apps/**/.astro/**,\
  README.md

# Agent and competitor landing data: one same-shaped entry per item, so CPD flags the shape, not copied logic.
sonar.cpd.exclusions=\
  apps/web/src/lib/securityQuestionnaireEnterprise.ts,\
  apps/web/src/data/agents.ts,\
  apps/web/src/data/alternatives/**,\
  apps/web/src/pages/security-questionnaire.astro,\
  apps/docs/astro.config.mjs,\
  apps/web/astro.config.mjs,\
  apps/docs/src/content/**,\
  apps/web/src/content/**,\
  docs/**,\
  README.md
