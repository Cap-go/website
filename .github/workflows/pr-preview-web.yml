name: PR Preview (web)

concurrency:
  group: pr-preview-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  resolve-preview-name:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.preview.outputs.name }}
    steps:
      - id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          pr_number="${PR_NUMBER}"
          branch_name="${HEAD_REF}"
          sanitized_branch=$(echo "$branch_name" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
          preview_name="pr-${pr_number}-${sanitized_branch}"
          if [ "${#preview_name}" -gt 28 ]; then
            preview_name="pr-${pr_number}-$(echo "$sanitized_branch" | cut -c1-$((28 - ${#pr_number} - 4)))"
          fi
          echo "name=$preview_name" >> "$GITHUB_OUTPUT"

  deploy-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    needs: resolve-preview-name
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    environment: preview
    env:
      NODE_OPTIONS: '--max-old-space-size=16384'
      UV_THREADPOOL_SIZE: '32'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run build:web
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ORAMA_CLOUD_API_KEY: ${{ secrets.ORAMA_CLOUD_API_KEY }}
          ORAMA_CLOUD_ENDPOINT: ${{ secrets.ORAMA_CLOUD_ENDPOINT }}
          CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}

      - name: Enable Worker preview URLs
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/capgo-website/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Cloudflare-Workers-Script-Api-Date: 2025-08-01" \
            -d '{"enabled":false,"previews_enabled":true}'

      - name: Deploy Worker preview
        id: worker_preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler@4.137.0 preview --name "${{ needs.resolve-preview-name.outputs.name }}" --json 2>wrangler.stderr | tee preview.json
          preview_url=$(node -e "
            const fs = require('node:fs');
            const raw = fs.readFileSync('preview.json', 'utf8');
            const start = raw.indexOf('{');
            const end = raw.lastIndexOf('}');
            if (start === -1 || end === -1 || end <= start) {
              console.error('No JSON object in wrangler preview output');
              console.error(raw.slice(0, 2000));
              process.exit(1);
            }
            const data = JSON.parse(raw.slice(start, end + 1));
            const urls = [
              ...(data.preview?.urls ?? []),
              ...(data.preview_urls ?? []),
              ...(data.deployment?.urls ?? []),
              ...(data.deployment_urls ?? []),
            ];
            const url = urls.find((u) => typeof u === 'string' && u.startsWith('https://'));
            if (!url) {
              console.error('No preview URL in wrangler output');
              console.error(raw);
              process.exit(1);
            }
            process.stdout.write(url);
          ")
          echo "url=${preview_url%/}" >> "$GITHUB_OUTPUT"

      - name: Cache Tailwind Capacitor registry snapshot
        uses: actions/cache@v4
        with:
          path: apps/web/src/tailwind-capacitor-snapshot
          key: tailwind-capacitor-snapshot-${{ hashFiles('apps/shared/config/tailwindCapacitorRegistry.ts', 'apps/web/vendor/tailwind-capacitor-registry-snapshot/registry-manifest.json') }}
          restore-keys: |
            tailwind-capacitor-snapshot-

      - name: Update PR preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.worker_preview.outputs.url }}
          PREVIEW_NAME: ${{ needs.resolve-preview-name.outputs.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = process.env.PREVIEW_URL
            const previewName = process.env.PREVIEW_NAME
            const prNumber = Number(process.env.PR_NUMBER)
            const commitSha = process.env.COMMIT_SHA
            const shortSha = commitSha.substring(0, 7)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            })
            const marker = 'PR Preview (web worker build)'
            const botComment = comments.data.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
            )
            const demoUrl = `${previewUrl}/plugins/tailwind-capacitor/demo/`
            const body = [
              marker,
              '',
              `Preview URL: ${previewUrl}`,
              `Preview name: \`${previewName}\``,
              `Demo: ${demoUrl}`,
              `Commit: [\`${shortSha}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha})`,
              '',
              'Deployed with `wrangler preview` on the `capgo-website` Worker (production is Workers on capgo.app, not Cloudflare Pages).',
              'When this PR closes, the `cleanup-preview` job runs `wrangler preview delete` for this preview name.',
              'Updated on each push to this PR.',
            ].join('\n')
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
            }

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false
    needs: resolve-preview-name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Delete Worker preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREVIEW_NAME="${{ needs.resolve-preview-name.outputs.name }}"
          set +e
          output="$(bunx wrangler@4.137.0 preview delete --name "$PREVIEW_NAME" -y 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qiE 'not found|does not exist|No preview'; then
              echo "Preview already removed: $PREVIEW_NAME"
            else
              echo "$output"
              exit "$status"
            fi
          fi