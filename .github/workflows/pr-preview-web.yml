name: PR Preview (web)

concurrency:
  group: pr-preview-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  resolve-preview-name:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.preview.outputs.name }}
    steps:
      - id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          preview_name="pr-${PR_NUMBER}"
          echo "name=$preview_name" >> "$GITHUB_OUTPUT"

  deploy-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    needs: resolve-preview-name
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    environment: preview
    env:
      NODE_OPTIONS: '--max-old-space-size=16384'
      UV_THREADPOOL_SIZE: '32'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6 # NOSONAR - pinned by version tag (repo policy)
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2 # NOSONAR - pinned by version tag (repo policy)
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run build:web
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ORAMA_CLOUD_API_KEY: ${{ secrets.ORAMA_CLOUD_API_KEY }}
          ORAMA_CLOUD_ENDPOINT: ${{ secrets.ORAMA_CLOUD_ENDPOINT }}
          CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}

      - name: Enable workers.dev Preview URLs (production route stays off)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../../scripts/enable-workers-dev-previews.mjs

      - name: Deploy Worker preview
        id: worker_preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ../../node_modules/.bin/wrangler preview --name "${{ needs.resolve-preview-name.outputs.name }}" --json 2>wrangler.stderr | tee preview.json
          preview_url=$(PREVIEW_NAME="${{ needs.resolve-preview-name.outputs.name }}" node -e "
            const fs = require('node:fs');
            const raw = fs.readFileSync('preview.json', 'utf8');
            const start = raw.indexOf('{');
            const end = raw.lastIndexOf('}');
            if (start === -1 || end === -1 || end <= start) {
              console.error('No JSON object in wrangler preview output');
              console.error(raw.slice(0, 2000));
              process.exit(1);
            }
            const data = JSON.parse(raw.slice(start, end + 1));
            const urls = [
              ...(data.preview?.urls ?? []),
              ...(data.preview_urls ?? []),
              ...(data.deployment?.urls ?? []),
              ...(data.deployment_urls ?? []),
            ];
            let url = urls.find((u) => typeof u === 'string' && u.startsWith('https://'));
            if (!url) {
              const slug = data.preview?.slug || data.preview?.name || process.env.PREVIEW_NAME;
              const workersSubdomain = process.env.CLOUDFLARE_WORKERS_SUBDOMAIN || 'digitalshift-ee';
              const workerScript = 'capgo-website';
              const deployId = data.deployment?.id?.split('-')?.[0];
              if (deployId) {
                url = \`https://\${deployId}-\${workerScript}.\${workersSubdomain}.workers.dev\`;
              } else if (slug) {
                url = \`https://\${slug}-\${workerScript}.\${workersSubdomain}.workers.dev\`;
              }
            }
            if (!url) {
              console.error('No preview URL in wrangler output');
              console.error(raw);
              process.exit(1);
            }
            process.stdout.write(url);
          ")
          echo "url=${preview_url%/}" >> "$GITHUB_OUTPUT"

      - name: Update PR preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.worker_preview.outputs.url }}
          PREVIEW_NAME: ${{ needs.resolve-preview-name.outputs.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = process.env.PREVIEW_URL
            const previewName = process.env.PREVIEW_NAME
            const prNumber = Number(process.env.PR_NUMBER)
            const commitSha = process.env.COMMIT_SHA
            const shortSha = commitSha.substring(0, 7)
            const marker = 'PR Preview (web worker build)'
            let botComment
            for (let page = 1; ; page += 1) {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
                page,
              })
              botComment = comments.data.find(
                (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
              )
              if (botComment || comments.data.length < 100) break
            }
            const demoUrl = `${previewUrl}/plugins/tailwind-capacitor/demo/`
            const body = [
              marker,
              '',
              `Preview URL: ${previewUrl}`,
              `Preview name: \`${previewName}\``,
              `Demo: ${demoUrl}`,
              `Commit: [\`${shortSha}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha})`,
              '',
              'Deployed with `wrangler preview` on the `capgo-website` Worker (production is Workers on capgo.app, not Cloudflare Pages).',
              'When this PR closes, the `cleanup-preview` job runs `wrangler preview delete` for this preview name.',
              'Updated on each push to this PR.',
            ].join('\n')
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
            }

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false
    needs: resolve-preview-name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2 # NOSONAR - pinned by version tag (repo policy)
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Delete Worker preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREVIEW_NAME="${{ needs.resolve-preview-name.outputs.name }}"
          set +e
          output="$(../../node_modules/.bin/wrangler preview delete --name "$PREVIEW_NAME" -y 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qiE 'not found|does not exist|No preview'; then
              echo "Preview already removed: $PREVIEW_NAME"
            else
              echo "$output"
              exit "$status"
            fi
          fi