name: Deploy Web

concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/shared/**'
      - 'scripts/**'
      - 'configs.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-web.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ios-udid-signing-cert:
    name: iOS UDID signing cert
    if: github.repository == 'Cap-go/website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Check whether Let's Encrypt renewal is due
        id: cert
        env:
          IOS_UDID_PROFILE_SIGNING_CERT_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_CERT_PEM }}
          IOS_UDID_PROFILE_SIGNING_KEY_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_KEY_PEM }}
        run: bash scripts/renew-ios-udid-signing-cert.sh check
      - if: steps.cert.outputs.renew == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - if: steps.cert.outputs.renew == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Issue or renew UDID signing cert
        if: steps.cert.outputs.renew == 'true'
        env:
          IOS_UDID_PROFILE_SIGNING_CERT_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_CERT_PEM }}
          IOS_UDID_PROFILE_SIGNING_KEY_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_KEY_PEM }}
          IOS_UDID_PROFILE_SIGNING_CHAIN_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_CHAIN_PEM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: bash scripts/renew-ios-udid-signing-cert.sh issue

  typos:
    name: Check for Typos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Checkout Repository
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Check for Typos
        # v1.44.0
        uses: crate-ci/typos@631208b7aac2daa8b707f55e7331f9112b0e062d

  build:
    runs-on: ubuntu-latest
    needs: typos
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=16384'
      UV_THREADPOOL_SIZE: '32'
    steps:
      # actions/checkout v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Cache bun modules
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Astro build
        uses: actions/cache@v5
        with:
          path: |
            apps/web/.astro
            node_modules/.astro
            node_modules/.cache
          key: ${{ runner.os }}-astro-web-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('apps/web/**', 'apps/shared/**', 'scripts/**', 'configs.json') }}
          restore-keys: |
            ${{ runner.os }}-astro-web-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-astro-web-

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bun ./node_modules/playwright/cli.js install chromium
      - name: Fetch latest global stats
        run: |
          GITHUB_STATS_REFRESH=true bun run fetch:stars
          WEBSITE_STATS_REFRESH=true bun run fetch:website-stats
          LIVE_UPDATE_METRICS_REFRESH=true bun run fetch:live-update-metrics
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - run: cd apps/web && bun run check
      - run: bun run clean:build-cache
      - run: bun run build:web
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ORAMA_CLOUD_API_KEY: ${{ secrets.ORAMA_CLOUD_API_KEY }}
          ORAMA_CLOUD_ENDPOINT: ${{ secrets.ORAMA_CLOUD_ENDPOINT }}
          CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}
      - run: bun run build:after
      - run: bun run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
