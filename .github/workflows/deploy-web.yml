name: Deploy Web

concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - abtest
    paths:
      - 'apps/web/**'
      - 'apps/shared/**'
      - 'scripts/**'
      - 'configs.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-web.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ios-udid-signing-cert:
    name: iOS UDID signing cert
    if: github.repository == 'Cap-go/website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Check whether Let's Encrypt renewal is due
        id: cert
        env:
          IOS_UDID_PROFILE_SIGNING_CERT_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_CERT_PEM }}
          IOS_UDID_PROFILE_SIGNING_KEY_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_KEY_PEM }}
        run: bash scripts/renew-ios-udid-signing-cert.sh check
      - if: steps.cert.outputs.renew == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - if: steps.cert.outputs.renew == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Issue or renew UDID signing cert
        if: steps.cert.outputs.renew == 'true'
        env:
          IOS_UDID_PROFILE_SIGNING_CERT_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_CERT_PEM }}
          IOS_UDID_PROFILE_SIGNING_KEY_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_KEY_PEM }}
          IOS_UDID_PROFILE_SIGNING_CHAIN_PEM: ${{ secrets.IOS_UDID_PROFILE_SIGNING_CHAIN_PEM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: bash scripts/renew-ios-udid-signing-cert.sh issue

  typos:
    name: Check for Typos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Checkout Repository
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Check for Typos
        # v1.44.0
        uses: crate-ci/typos@631208b7aac2daa8b707f55e7331f9112b0e062d

  plan:
    name: Plan deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      abtest: ${{ steps.plan.outputs.abtest }}
      percent: ${{ steps.plan.outputs.percent }}
      flag: ${{ steps.plan.outputs.flag }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      # actions/checkout v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      # Branch A/B test (docs/abtest.md): while `abtest` has commits that are not in
      # `main`, deploy both branches as Worker versions and split traffic between them.
      - id: plan
        env:
          ABTEST_PERCENT: ${{ vars.ABTEST_PERCENT || '50' }}
          ABTEST_FLAG: ${{ vars.ABTEST_FLAG || 'website-abtest' }}
        run: |
          set -euo pipefail
          [[ "$ABTEST_PERCENT" =~ ^[0-9]+$ ]] || { echo "::error::ABTEST_PERCENT must be an integer"; exit 1; }
          [[ "$ABTEST_FLAG" =~ ^[A-Za-z0-9_.:-]{1,64}$ ]] || { echo "::error::ABTEST_FLAG is not a valid flag key"; exit 1; }
          ahead=0
          if git rev-parse --verify --quiet origin/abtest >/dev/null; then
            ahead=$(git rev-list --count origin/main..origin/abtest)
          fi
          abtest=false
          if [ "$ahead" -gt 0 ] && [ "$ABTEST_PERCENT" -gt 0 ] && [ "$ABTEST_PERCENT" -lt 100 ]; then abtest=true; fi
          skip=false
          if [ "$GITHUB_REF_NAME" = abtest ] && [ "$abtest" = false ]; then skip=true; fi
          if [ "$abtest" = true ]; then
            targets='[{"ref":"main","variant":"control"},{"ref":"abtest","variant":"test"}]'
          else
            targets='[{"ref":"main","variant":""}]'
          fi
          {
            echo "skip=$skip"
            echo "abtest=$abtest"
            echo "percent=$ABTEST_PERCENT"
            echo "flag=$ABTEST_FLAG"
            echo "targets=$targets"
          } >> "$GITHUB_OUTPUT"
          echo "abtest=$abtest ahead=$ahead percent=$ABTEST_PERCENT flag=$ABTEST_FLAG skip=$skip"

  build:
    name: Build ${{ matrix.target.ref }}
    runs-on: ubuntu-latest
    needs: [typos, plan]
    if: needs.plan.outputs.skip != 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      NODE_OPTIONS: '--max-old-space-size=16384'
      UV_THREADPOOL_SIZE: '32'
    steps:
      # actions/checkout v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ matrix.target.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Cache bun modules
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Astro build
        uses: actions/cache@v5
        with:
          path: |
            apps/web/.astro
            node_modules/.astro
            node_modules/.cache
          key: ${{ runner.os }}-astro-web-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('apps/web/**', 'apps/shared/**', 'scripts/**', 'configs.json') }}
          restore-keys: |
            ${{ runner.os }}-astro-web-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-astro-web-

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: node ./node_modules/playwright/cli.js install chromium
      - run: cd apps/web && bun run check
      - run: bun run clean:build-cache
      - run: bun run build:web
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ORAMA_CLOUD_API_KEY: ${{ secrets.ORAMA_CLOUD_API_KEY }}
          ORAMA_CLOUD_ENDPOINT: ${{ secrets.ORAMA_CLOUD_ENDPOINT }}
          CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}
      - run: bun run build:after
      - name: Remove legacy builder-metrics Worker secrets
        if: needs.plan.outputs.abtest != 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4.126.0 secret delete SUPABASE_SERVICE_ROLE_KEY || true
          bunx wrangler@4.126.0 secret delete BUILDER_DATABASE_URL || true
      - run: bun run deploy:web
        if: needs.plan.outputs.abtest != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload Worker version
        if: needs.plan.outputs.abtest == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AB_FLAG: ${{ needs.plan.outputs.flag }}
          AB_VARIANT: ${{ matrix.target.variant }}
          AB_REF: ${{ matrix.target.ref }}
        run: |
          set -euo pipefail
          bunx wrangler versions upload --tag "$AB_REF" --message "$AB_REF $(git rev-parse --short HEAD)" \
            --var "AB_FLAG:$AB_FLAG" --var "AB_VARIANT:$AB_VARIANT" | tee upload.log
          version=$(grep -oE 'Worker Version ID: *[0-9a-f-]{36}' upload.log | grep -oE '[0-9a-f-]{36}$' | tail -1)
          test -n "$version"
          echo "$version" > "$RUNNER_TEMP/version-$AB_VARIANT.txt"
      - if: needs.plan.outputs.abtest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: version-${{ matrix.target.variant }}
          path: ${{ runner.temp }}/version-${{ matrix.target.variant }}.txt
          retention-days: 1

  split:
    name: Split traffic main/abtest
    runs-on: ubuntu-latest
    needs: [plan, build]
    if: needs.plan.outputs.abtest == 'true'
    timeout-minutes: 10
    steps:
      # actions/checkout v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
      # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          pattern: version-*
          merge-multiple: true
          path: ${{ runner.temp }}/versions
      - name: Deploy split
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PERCENT: ${{ needs.plan.outputs.percent }}
        run: |
          set -euo pipefail
          control=$(cat "$RUNNER_TEMP/versions/version-control.txt")
          test_version=$(cat "$RUNNER_TEMP/versions/version-test.txt")
          bunx wrangler@4.137.0 versions deploy "$control@$((100 - PERCENT))" "$test_version@$PERCENT" -y \
            --message "abtest: main $((100 - PERCENT))% / abtest $PERCENT%"
          # Routes and custom domains are not part of a version upload.
          bunx wrangler@4.137.0 triggers deploy
