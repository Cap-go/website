name: 'IndexNow'
on:
  schedule:
    # Set the schedule time
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Submit URLs modified in the last N days, or "all"'
        default: '2'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Submit recently updated URLs to IndexNow
        env:
          DAYS: ${{ inputs.days || '2' }}
        run: bun run scripts/indexnow.ts "$DAYS"

  google-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: robingenz/action-google-indexing@v1.0.2
        with:
          siteUrl: 'capgo.app'
          gcpServiceAccountKey: ${{ secrets.GCP_SA_KEY }}
