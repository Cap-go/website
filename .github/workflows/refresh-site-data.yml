name: Refresh site data

# Nightly refresh of the JSON snapshots the website build reads (GitHub stars/stats,
# transparency facts, website stats, npm downloads, plans/credits, store rankings,
# sponsors, GitHub releases for /feed.xml). Deploys never fetch this data themselves,
# so a release is not slowed down or broken by third-party APIs.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-site-data
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    name: Fetch latest site data
    if: github.repository == 'Cap-go/website'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write required so git-auto-commit can push updated JSON when data changes.
    # actions: write lets the job start Deploy Web: pushes made with GITHUB_TOKEN do not trigger workflows.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          # Needed by git-auto-commit-action to push commits.
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Cache bun modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      # --ignore-scripts: avoid running dependency lifecycle scripts during CI install.
      - run: bun install --frozen-lockfile --ignore-scripts
      # Each fetch keeps the previous values when a source is unreachable, so one
      # failing source must not block committing the others.
      - name: Fetch GitHub stars and stats
        id: stars
        continue-on-error: true
        run: GITHUB_STATS_REFRESH=true bun run fetch:stars
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Fetch transparency data
        id: transparency
        continue-on-error: true
        run: bun run fetch:transparency
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Fetch website stats
        id: website_stats
        continue-on-error: true
        run: WEBSITE_STATS_REFRESH=true bun run fetch:website-stats
      - name: Fetch npm downloads
        id: downloads
        continue-on-error: true
        run: NPM_DOWNLOADS_REFRESH=true bun run fetch:downloads
      - name: Fetch plans, credits, store rankings, sponsors, and GitHub releases
        id: build_data
        continue-on-error: true
        run: bun run fetch:build-data
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      # Fetch timestamps change on every run; skip files where nothing else changed.
      - name: Drop timestamp-only changes
        run: |
          for file in apps/web/src/data/website-stats.json apps/web/src/data/transparency.json; do
            git diff --quiet -- "$file" && continue
            if FILE="$file" bun -e '
              const file = process.env.FILE
              const strip = (text) => {
                const { fetchedAt, updatedAt, ...rest } = JSON.parse(text)
                return JSON.stringify(rest)
              }
              const before = await Bun.$`git show HEAD:${file}`.text()
              process.exit(strip(before) === strip(await Bun.file(file).text()) ? 0 : 1)
            '; then
              echo "Only timestamps changed in $file, discarding"
              git checkout -- "$file"
            fi
          done
      - name: Commit changes if data differs
        id: commit
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: 'chore: refresh site data snapshots'
          file_pattern: 'apps/web/src/data/github-stars.json apps/web/src/data/github-stats.json apps/web/src/data/transparency.json apps/web/src/data/website-stats.json apps/web/src/data/npm-downloads.json apps/web/src/data/capgo-plans.json apps/web/src/data/capgo-credits.json apps/web/src/data/store-top.json apps/web/src/data/github-sponsors.json apps/web/src/data/github-releases.json'
      - name: Deploy the refreshed data
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "$GITHUB_REPOSITORY" --ref main
      # Fetch steps continue on error so partial data still lands; fail the run afterwards so a broken source is visible.
      - name: Fail if any fetch failed
        if: steps.stars.outcome == 'failure' || steps.transparency.outcome == 'failure' || steps.website_stats.outcome == 'failure' || steps.downloads.outcome == 'failure' || steps.build_data.outcome == 'failure'
        run: |
          echo "::error::Fetch outcomes: stars=${{ steps.stars.outcome }} transparency=${{ steps.transparency.outcome }} website_stats=${{ steps.website_stats.outcome }} downloads=${{ steps.downloads.outcome }} build_data=${{ steps.build_data.outcome }}"
          exit 1
