name: Sync PR body from file

on:
  push:
    branches:
      - feat/website-live-plan
    paths:
      - '.github/pr-body-sync/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('.github/pr-body-sync/pr-1099.md', 'utf8')
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 1099,
              body,
            })
