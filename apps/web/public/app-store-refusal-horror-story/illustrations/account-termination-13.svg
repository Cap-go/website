<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Different localized app title and unused remote config leading to section 3.2(f) termination">
  <title>Different localized app title and unused remote config leading to section 3.2(f) termination</title>
  <rect width="320" height="200" fill="#0F172A" rx="16"/>
  <rect x="24" y="44" width="88" height="72" rx="10" fill="#111827" stroke="#9CA3AF" stroke-width="2"/>
  <text x="36" y="68" fill="#9CA3AF" font-family="system-ui,sans-serif" font-size="7">EN title</text>
  <rect x="36" y="76" width="64" height="12" rx="4" fill="#44BCFF" opacity="0.35"/>
  <text x="36" y="104" fill="#EF4444" font-family="system-ui,sans-serif" font-size="7">de title</text>
  <rect x="36" y="88" width="56" height="12" rx="4" fill="#111827" stroke="#EF4444" stroke-width="2"/>
  <rect x="124" y="52" width="72" height="56" rx="10" fill="#111827" stroke="#FBBF24" stroke-width="2"/>
  <text x="132" y="72" fill="#FBBF24" font-family="system-ui,sans-serif" font-size="6">config</text>
  <path d="M148 84 L148 100" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="132" y="96" fill="#9CA3AF" font-family="system-ui,sans-serif" font-size="6">unused</text>
  <path d="M112 80 L124 80" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="208" y="36" width="88" height="128" rx="12" fill="#111827" stroke="#EF4444" stroke-width="2"/>
  <text x="220" y="60" fill="#EF4444" font-family="system-ui,sans-serif" font-size="8" font-weight="600">48h</text>
  <text x="220" y="78" fill="#9CA3AF" font-family="system-ui,sans-serif" font-size="7">explain</text>
  <rect x="220" y="92" width="64" height="8" rx="4" fill="#374151"/>
  <rect x="220" y="108" width="48" height="8" rx="4" fill="#374151" opacity="0.6"/>
  <rect x="208" y="128" width="88" height="28" rx="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
  <text x="218" y="147" fill="#EF4444" font-family="system-ui,sans-serif" font-size="8" font-weight="600">3.2(f)</text>
  <rect x="24" y="132" width="168" height="40" rx="10" fill="#111827" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="36" y="152" fill="#9CA3AF" font-family="system-ui,sans-serif" font-size="7">19 days later</text>
  <text x="36" y="166" fill="#EF4444" font-family="system-ui,sans-serif" font-size="7">termination confirmed</text>
