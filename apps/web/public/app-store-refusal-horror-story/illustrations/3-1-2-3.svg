  <rect x="212" y="88" width="88" height="24" rx="8" fill="#111827" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="228" y="104" fill="#FBBF24" font-family="system-ui,sans-serif" font-size="7">2.1(b)</text>
