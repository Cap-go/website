<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Termination overturned while payouts stay paused for two months">
  <title>Termination overturned while payouts stay paused for two months</title>
  <rect width="320" height="200" fill="#0F172A" rx="16"/>
