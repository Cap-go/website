<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-labelledby="portrait-landscape-title">
  <title id="portrait-landscape-title">Portrait orientation is taller than wide; landscape orientation is wider than tall</title>
  <rect width="520" height="220" fill="#0f172a"/>
  <text x="130" y="28" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Portrait</text>
  <rect x="70" y="40" width="120" height="160" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">height &gt; width</text>
  <text x="390" y="28" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Landscape</text>
  <rect x="300" y="88" width="180" height="112" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="390" y="150" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">width &gt; height</text>
</svg>
